services:
  postgres:
    image: postgres:16-alpine
    container_name: rithudevquest-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rithu
      POSTGRES_PASSWORD: rithu123
      POSTGRES_DB: rithudevquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rithu -d rithudevquest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: